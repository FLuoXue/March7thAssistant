name: Build & Release App

on:
  workflow_dispatch:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

jobs:
  build:
    uses: ./.github/workflows/13.package.yml
    with:
      source_sha: ${{ github.sha }}
      release_tag: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
      artifact_name: release-package-${{ github.run_attempt }}

  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - name: Download built package
        uses: actions/download-artifact@v8
        with:
          name: ${{ needs.build.outputs.artifact_name }}
          path: release-package

      # 创建GitHub发布
      - name: Create release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: March7thAssistant ${{ github.ref_name }}
          body_path: release-package/changelog_temp.md
          files: |
            ./release-package/March7thAssistant_full.zip
            ./release-package/March7thAssistant_full.7z
            ./release-package/update.7z
          prerelease: ${{ contains(github.ref_name, 'beta') }}
          make_latest: true

      # 强制触发 MirrorChyan 上传
      - name: Trigger MirrorChyanUploading
        if: github.repository == 'moesnow/March7thAssistant' && startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          gh workflow run --repo $GITHUB_REPOSITORY 'MirrorChyan Uploading'
          gh workflow run --repo $GITHUB_REPOSITORY 'MirrorChyan Release Note'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
