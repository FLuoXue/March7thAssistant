name: Tests

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "**/*.py"
      - "native/**"
      - "assets/locales/**"
      - "assets/docs/**"
      - "requirements.txt"
      - "pyproject.toml"
      - "uv.lock"

  pull_request:
    branches:
      - main
    paths:
      - "**/*.py"
      - "native/**"
      - "assets/locales/**"
      - "assets/docs/**"
      - "requirements.txt"
      - "pyproject.toml"
      - "uv.lock"

jobs:
  test:
    name: Test (${{ matrix.os }}, ${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows
            arch: x86
            runner: windows-latest
            python-version: "3.14.5"
          - os: macos
            arch: arm64
            runner: macos-latest
            python-version: "3.14.5"
          - os: linux
            arch: x86
            runner: ubuntu-latest
            python-version: "3.14.5"
          - os: linux
            arch: arm64
            runner: ubuntu-24.04-arm
            python-version: "3.14.5"

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install Qt dependencies (Linux)
        if: matrix.os == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libdbus-1-3

      - name: Set up uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          version: "0.11.15"
          python-version: ${{ matrix.python-version }}
          enable-cache: true
          cache-python: true
          prune-cache: false

      - name: Install dependencies
        run: uv sync --group dev

      - name: Set up .NET SDK for desktop session
        if: matrix.os == 'windows'
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.x'

      - name: Build and check desktop session host
        if: matrix.os == 'windows'
        run: |
          uv run python tools/build_desktop_session.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $hostTest = Start-Process -FilePath '.\build\desktop-session\March7th.Desktop.exe' -ArgumentList '--self-test' -WindowStyle Hidden -Wait -PassThru
          if ($hostTest.ExitCode -ne 0) { exit $hostTest.ExitCode }

      - name: Check translation catalogs
        run: uv run python -m tools.i18n check

      - name: Run tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: uv run pytest tests/ -v --tb=short
