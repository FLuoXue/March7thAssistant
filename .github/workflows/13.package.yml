name: Package candidate

on:
  workflow_call:
    inputs:
      source_sha:
        required: true
        type: string
      release_tag:
        type: string
        default: ''
      artifact_name:
        type: string
        default: release-package
    outputs:
      artifact_name:
        value: ${{ jobs.build.outputs.artifact_name }}

permissions:
  contents: read

jobs:
  build:
    name: Build
    outputs:
      artifact_name: ${{ inputs.artifact_name }}
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      RELEASE_TAG: ${{ inputs.release_tag }}
      PYTHONHASHSEED: 0
      SOURCE_DATE_EPOCH: 315532800
      MARCH7TH_LOG_LEVEL: DEBUG
      MARCH7TH_BROWSER_DOWNLOAD_USE_MIRROR: false
      PYTHONIOENCODING: utf-8
      # 7-Zip ZS（含 Fast LZMA2）只作打包工具，缓存在 Actions 缓存里，不入库；
      # 产物是标准 LZMA2 流，用户端 stock 7za 可正常解压。
      ZS_VERSION: "26.02-v1.5.7-R2"
      ZS_URL: "https://github.com/mcmilk/7-Zip-zstd/releases/download/v26.02-v1.5.7-R2/7z26.02-zstd-x64.exe"

    steps:
      # 签出代码
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          submodules: "false"
          ref: ${{ inputs.source_sha }}
          persist-credentials: false

      - name: Verify requested commit and release version
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          $actual = (git rev-parse HEAD).Trim()
          if ($actual -ne $env:SOURCE_SHA) { throw "Checkout SHA mismatch" }
          if ($env:RELEASE_TAG -and (Get-Content assets/config/version.txt -Raw).Trim() -ne $env:RELEASE_TAG) {
            throw "Release tag does not match version.txt"
          }

      # 设置 uv 和 Python 环境
      - name: Set up uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          version: "0.11.15"
          python-version: "3.14.5"
          enable-cache: false
          cache-python: false
          prune-cache: false

      # 安装依赖
      - name: Set up .NET SDK for desktop session
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.x'

      - name: Install dependencies
        run: |
          uv sync --group build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          uv run python build.py --task ocr

      # 并行生成程序
      - name: Generate program
        run: |
          $p1 = Start-Process -FilePath "uv" -ArgumentList 'run pyinstaller --distpath ".\dist" ".\March7th Assistant.spec" -y' -PassThru -NoNewWindow
          $p2 = Start-Process -FilePath "uv" -ArgumentList 'run pyinstaller --distpath ".\dist" ".\March7th Launcher.spec" -y' -PassThru -NoNewWindow
          $p3 = Start-Process -FilePath "uv" -ArgumentList 'run pyinstaller --distpath ".\dist\March7thAssistant" ".\March7th Updater.spec" -y' -PassThru -NoNewWindow
          $p1.WaitForExit(); $p2.WaitForExit(); $p3.WaitForExit()
          if ($p1.ExitCode -ne 0 -or $p2.ExitCode -ne 0 -or $p3.ExitCode -ne 0) {
            Write-Host "Exit codes: Assistant=$($p1.ExitCode) Launcher=$($p2.ExitCode) Updater=$($p3.ExitCode)"
            exit 1
          }

      # 移动资源到dist目录
      - name: Move assets to dist directory
        run: |
          Copy-Item -Path ".\dist\March7th Assistant\*" -Destination ".\dist\March7thAssistant\" -Recurse -Force
          Copy-Item -Path ".\dist\March7th Launcher\*" -Destination ".\dist\March7thAssistant\" -Recurse -Force
          Copy-Item -Path ".\assets\" -Destination ".\dist\March7thAssistant\assets\" -Recurse -Force
          Copy-Item -Path ".\README.md" -Destination ".\dist\March7thAssistant\" -Force

      # 缓存 7-Zip ZS，避免每次发版重复下载二进制。
      # 注意 GitHub 缓存按 ref 隔离：tag 触发的运行只能读默认分支（main）作用域的缓存，
      # 不同 tag 之间也不共享，所以在 main 上手动 workflow_dispatch 跑一次本工作流预热缓存，
      # 之后 tag 发版打包才会命中（本步骤不挂 tag 条件，就是为了能在 main 上预热）。
      - name: Restore 7-Zip ZS cache
        id: cache-7zzs
        uses: actions/cache@v5
        with:
          path: temp/7zzs
          key: 7zzs-${{ env.ZS_VERSION }}

      # 仅在缓存未命中时下载 7-Zip ZS，并用仓库自带 stock 7za 解开安装包，不改动 assets/binary/7za.exe
      # 注意：PowerShell 会把 -o.\temp\7zzs 拆成两个 token，报 Too short switch: -o，必须整体加引号
      - name: Download 7-Zip ZS (cache miss)
        if: steps.cache-7zzs.outputs.cache-hit != 'true'
        run: |
          New-Item -ItemType Directory -Force -Path .\temp\7zzs | Out-Null
          curl.exe -sL -o .\temp\7zzs-setup.exe "$env:ZS_URL"
          if ($LASTEXITCODE -ne 0) { Write-Host "download failed"; exit 1 }
          $sz = (Get-Item .\temp\7zzs-setup.exe).Length
          Write-Host "downloaded 7zzs-setup.exe: $sz bytes"
          if ($sz -lt 1000000) { Write-Host "download too small, likely failed"; exit 1 }
          .\assets\binary\7za.exe x -y ".\temp\7zzs-setup.exe" "-o.\temp\7zzs"
          if ($LASTEXITCODE -ne 0) { Write-Host "extract failed"; exit 1 }
          & .\temp\7zzs\7za.exe | Select-Object -First 2

      # 创建更新压缩包
      # 压缩参数是 2026-09-28 实测标定值（9.test_build_optimization.yml 基准，run 36381841850）：
      #   - update.7z（核心包）：flzma2 -mx=7 —— 快约 2.8 倍，体积 −1.55%
      #   - full.7z（完整包）：flzma2 -mx=9 —— 快约 1.4 倍，体积 −0.83%
      #     （flzma2 降 mx=7 体积反而 +8%，mx=9 才是完整包最小值）
      #   - full.zip 保持 stock deflate 不变
      # flzma2 档位曲线非单调，-mx=N 与 lzma2 -mx=N 不是同一套参数，不要自行调整，也不要加 -md 钉字典；
      # 解压侧已实测：stock 7za 解 flzma2 归档与解 lzma2 归档速度、内容均无差异。
      # 注意：不要把下面的压缩/下载步骤改成并行。7za 是 CPU 密集型，windows-latest 仅 4 核，
      # 多进程压缩会互相抢核，实测反而更慢，不需要再尝试。
      # 2026-09-23 实测（run 35881339484）：
      #   - full.zip 与 full.7z 并行：309s → 363s（+54s）。zip 53s→127.5s，7z 256s→363.3s。
      #   - update.7z 与 3rdparty 下载并行：零收益。zip 解压抢核抵消了等待时间（127s+25s ≈ 144s vs 143.9s）。
      - name: Create archive
        if: inputs.release_tag != ''
        run: |
          # Compress-Archive -Path .\dist\March7thAssistant\ -DestinationPath .\dist\March7thAssistant.zip -Force
          Rename-Item -Path .\dist\March7thAssistant -NewName update
          .\temp\7zzs\7za.exe a -t7z -m0=flzma2 -ms=on -mx=7 .\dist\update.7z .\dist\update\
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Rename-Item -Path .\dist\update -NewName March7thAssistant

      # 获取第三方库最新发布版本
      - name: Get 3rdparty release tags
        if: inputs.release_tag != ''
        id: deps-tags
        run: |
          $asu = (gh api repos/moesnow/Auto_Simulated_Universe/releases/latest --jq '.tag_name' 2>$null)
          $fhoe = (gh api repos/linruowuyin/Fhoe-Rail/releases/latest --jq '.tag_name' 2>$null)
          $fps = (gh api repos/winTEuser/Genshin_StarRail_fps_unlocker/releases/latest --jq '.tag_name' 2>$null)
          $buildHash = "${{ hashFiles('build.py', 'module/game/cloud.py') }}"
          $hash = "${asu}-${fhoe}-${fps}-${buildHash}"
          echo "hash=$hash" >> $env:GITHUB_OUTPUT
          Write-Host "3rdparty cache key: $hash"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 缓存第三方库
      - name: Restore 3rdparty cache
        if: inputs.release_tag != ''
        id: cache-3rdparty
        uses: actions/cache@v5
        with:
          path: 3rdparty
          key: 3rdparty-${{ steps.deps-tags.outputs.hash }}

      # 下载第三方库（缓存未命中时）
      - name: Download 3rdparty
        if: inputs.release_tag != '' && steps.cache-3rdparty.outputs.cache-hit != 'true'
        run: uv run python build.py --task all

      # 生成日志并移动第三方库到dist目录
      - name: Move 3rdparty to dist directory
        if: inputs.release_tag != ''
        run: |
          uv run python build.py --task changelog -v "$env:RELEASE_TAG" -o changelog_temp.md
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Copy-Item -Path .\3rdparty\ -Destination .\dist\March7thAssistant\3rdparty\ -Recurse -Force
          Rename-Item -Path .\dist\March7thAssistant -NewName March7thAssistant_full

      # 创建完整的压缩包
      # full.zip 保持 stock deflate（仓库自带 7za）不变；full.7z 用 flzma2 -mx=9（完整包实测最优档位）
      - name: Create full zip archive
        if: inputs.release_tag != ''
        run: |
          # Compress-Archive -Path .\dist\March7thAssistant_full\ -DestinationPath .\dist\March7thAssistant_full.zip -Force
          .\assets\binary\7za.exe a -tzip .\dist\March7thAssistant_full.zip .\dist\March7thAssistant_full\
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .\temp\7zzs\7za.exe a -t7z -m0=flzma2 -ms=on -mx=9 .\dist\March7thAssistant_full.7z .\dist\March7thAssistant_full\
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Stage package and checksum manifest
        if: inputs.release_tag != ''
        run: |
          New-Item -ItemType Directory -Force -Path release-package | Out-Null
          Copy-Item dist/March7thAssistant_full.zip,dist/March7thAssistant_full.7z,dist/update.7z,changelog_temp.md -Destination release-package
          $files = @{}
          foreach ($file in Get-ChildItem -LiteralPath release-package -File) {
            if ($file.Length -eq 0) { throw "Empty release asset" }
            $files[$file.Name] = (Get-FileHash -LiteralPath $file.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          }
          @{ sha = (git rev-parse HEAD).Trim(); tag = $env:RELEASE_TAG; files = $files } |
            ConvertTo-Json -Depth 4 | Set-Content -Encoding utf8 release-package/manifest.json

      - name: Upload package
        if: inputs.release_tag != ''
        uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.artifact_name }}
          path: release-package/*
          compression-level: 0
          if-no-files-found: error
          retention-days: 30
